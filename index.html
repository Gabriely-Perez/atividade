<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Fio de Ouro</title>
    <link rel="stylesheet" href="./landing.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="landing-page">
    <main class="landing-shell">
        <section class="landing-card">
            <!-- Todo o conteúdo vai aqui -->
             <div class="brand-mark">
                 <img src="./imgs/img-1.jpg" alt="logo do sistema"> 
             </div>
             <p class="eyebrow">Fio de Ouro</p>
             <p class="landing-highlight">Gerencie seu setor de forma organizada e eficiente</p>
             <p class="landing-description">Escolha como deseja acessar nossa plataforma. Você pode continuar pelo navegador ou instalar o aplicativo no seu dispositivo.</p>
             <div class="landing-actions">
                <!-- Aqui vai as duas opções -->
                 <a href="./index-desktop.html" class="button button-secondary">Acesse a versão web</a>
                 <button id="install-button" class="button button-primary" type="button" hidden>Instale o aplicativo</button>
             </div>
             <p id="install-message" class="install-message">Se a opção de instalação estiver disponível, ela aparecerá aqui.</p>
        </section>
    </main>
    <script src="landing.js"></script>
    
</body>
</html>
